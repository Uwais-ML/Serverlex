[build-system]
requires = ["setuptools>=61.0.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serverlex"
version = "2.1.0"
description = "Production-Safe ML Preprocessing, Diagnostics, Tuning, and Serving Platform"
readme = "README.md"
authors = [{ name = "Serverlex Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
serverlex-copilot = "serverlex.copilot.cli:main"

[project.optional-dependencies]
copilot = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.26.0"
]
fast = [
    "pybind11>=2.10.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "twine>=5.0",
    "build>=1.0"
]
all = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.26.0",
    "pybind11>=2.10.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "twine>=5.0",
    "build>=1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
