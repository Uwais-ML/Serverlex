name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Core library tests (fast, no ML model needed)
  # ---------------------------------------------------------------------------
  test-core:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov

      - name: Run core test suite
        run: |
          pytest tests/ \
            --ignore=tests/test_copilot.py \
            -v \
            --tb=short \
            --cov=serverlex \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job 2: Copilot lightweight tests (import, routing, hook — no torch)
  # ---------------------------------------------------------------------------
  test-copilot-lightweight:
    name: Copilot Lightweight Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e "."
          pip install pytest

      - name: Run copilot lightweight tests (no torch required)
        run: |
          pytest tests/test_copilot.py \
            -m "not inference" \
            -v \
            --tb=short

  # ---------------------------------------------------------------------------
  # Job 3: Copilot inference tests (actual model load + generation)
  # Runs only on push to main or on releases — too slow for every PR
  # ---------------------------------------------------------------------------
  test-copilot-inference:
    name: Copilot Inference Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install copilot dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[copilot]"
          pip install pytest

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-serverlex-copilot-0.5b-${{ hashFiles('serverlex/copilot/agent.py') }}
          restore-keys: |
            hf-serverlex-copilot-0.5b-

      - name: Run copilot inference tests
        env:
          HF_HUB_VERBOSITY: warning
          TRANSFORMERS_VERBOSITY: error
        run: |
          pytest tests/test_copilot.py \
            -v \
            --tb=short \
            -x

  # ---------------------------------------------------------------------------
  # Job 4: Package build validation
  # ---------------------------------------------------------------------------
  build-check:
    name: Build & Twine Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check packages with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  # ---------------------------------------------------------------------------
  # Job 5: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: |
          ruff check serverlex/ tests/ \
            --select E,W,F,I \
            --ignore E501,W503,E203 \
            --output-format=github

  # ---------------------------------------------------------------------------
  # Job 6: PyPI publish (only on GitHub Release)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-core, test-copilot-lightweight, build-check]
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
